function person(id) { return people[id]; }
function avatar(p, cls) {
  if (!p) return "";
  if (p.avatar) return `<img class="av ${cls || ""}" src="${esc(p.avatar)}" alt="">`;
  return `<span class="av ${cls || ""}" style="display:grid;place-items:center;background:#eff3f4;color:#0f1419;font-weight:700;font-size:15px">${esc(p.initial || "外")}</span>`;
}
function badges(p) {
  return `${p.verified ? `<span style="color:#1d9bf0">${ico.check}</span>` : ""}${p.gold ? `<span style="color:#e8a317">${ico.check}</span>` : ""}`;
}
function nameRow(p, time) {
  return `<div class="row"><span class="name">${esc(p.name)}</span>${badges(p)}<span class="handle">@${esc(p.handle)}${time ? " · " + esc(time) : ""}</span></div>`;
}
function find(id) { return posts.find((p) => p.id === id); }
function flag(id) { return state.flags[id] || { liked: false, reposted: false, bookmarked: false }; }
function rich(text) {
  const re = /(https?:\/\/[^\s]+)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(last, m.index));
    let url = m[1];
    const tail = url.match(/[),。，]+$/);
    if (tail) url = url.slice(0, -tail[0].length);
    const shown = url.replace(/^https?:\/\//, "");
    const short = shown.length > 32 ? shown.slice(0, 28) + "…" : shown;
    out += `<a class="inline" href="${esc(url)}" target="_blank" rel="noopener">${esc(short)}</a>`;
    last = m.index + url.length;
  }
  return out + esc(text.slice(last));
}
function toast(text) { state.toast = text; render(); setTimeout(() => { state.toast = ""; render(); }, 1400); }
function postHtml(post) {
  const p = person(post.user);
  const f = flag(post.id);
  const open = state.open[post.id];
  const parts = post.preview && !open ? post.parts.slice(0, post.preview) : post.parts;
  const quote = post.quote && post.quote.text ? post.quote : (post.quote ? find(post.quote) : null);
  const likes = post.likes + (f.liked ? 1 : 0);
  const reposts = post.reposts + (f.reposted ? 1 : 0);
  const body = parts.map((t, i) => `<p>${rich(t)}${post.preview && !open && i === parts.length - 1 ? ` <span class="more" data-more="${esc(post.id)}">显示更多</span>` : ""}</p>`).join("");
  const qp = quote && quote.text ? { name: quote.author, handle: quote.handle, avatar: quote.avatar || knownAvatar[quote.handle] || "", verified: !!quote.verified, initial: (quote.author || "引").slice(0, 1) } : (quote ? person(quote.user) : null);
  const qtext = quote && quote.text ? quote.text : (quote ? quote.parts[0] : "");
  const qtime = quote ? (quote.time || "") : "";
  const qOpen = !!state.openQuote[post.id];
  const q = qp ? `<div class="quote${qOpen ? " open" : ""}" data-qmore="${esc(post.id)}"><span class="who">${avatar(qp, "sm")}<span class="name">${esc(qp.name)}</span>${badges(qp)}<span class="handle">@${esc(qp.handle)}${qtime ? " · " + esc(qtime) : ""}</span></span><p>${esc(qtext)}</p></div>` : "";
  const reply = post.reply && post.reply.author ? post.reply : null;
  const comments = post.comments && post.comments.length ? post.comments : (reply ? [reply] : []);
  const commentHtml = comments.map((c) => `<div class="replyrow"><span class="slot">${avatar({ avatar: c.avatar || knownAvatar[c.handle] || "", initial: (c.author || "回").slice(0, 1) }, "md")}</span><span class="body"><b>${esc(c.author || "")}</b> <span class="who">@${esc(c.handle || "")}</span><br>${esc(c.text || "")}</span></div>`).join("");
  return `<article class="post" data-id="${post.id}">
    <div class="col">${avatar(p, "")}${state.thread[post.id] && comments.length ? `<span class="line"></span>` : ""}</div>
    <div class="main">
      <div class="row">${nameRow(p, post.time)}
        <span class="tools">
          <button data-toast="这条先留在时间线上" aria-label="隐藏">${ico.hide}</button>
          <button data-toast="更多" aria-label="更多">${ico.more}</button>
        </span>
      </div>
      <div class="text">${body}</div>
      ${q}
      ${post.image ? `<img class="media" src="${esc(post.image)}" alt="">` : ""}
      <div class="acts">
        <button data-thread="${post.id}" aria-label="回复">${ico.reply}<span>${comments.length || post.replies || ""}</span></button>
        <button data-flag="reposted" data-id="${post.id}" class="${f.reposted ? "on-repost" : ""}" aria-label="转发">${ico.repost}<span>${reposts || ""}</span></button>
        <button data-flag="liked" data-id="${post.id}" class="${f.liked ? "on-like" : ""}" aria-label="喜欢">${ico.heart}<span>${likes}</span></button>
        <button data-toast="${post.views} 次查看" aria-label="查看">${ico.views}<span>${post.views}</span></button>
        <span style="display:flex" class="pair">
          <button data-flag="bookmarked" data-id="${post.id}" class="${f.bookmarked ? "on-blue" : ""}" aria-label="书签">${ico.bookmark}</button>
          ${post.link ? `<a class="jump" href="${esc(post.link)}" target="_blank" rel="noopener" aria-label="打开原帖">${ico.share}</a>` : `<button data-copy="${post.id}" aria-label="分享">${ico.share}</button>`}
        </span>
      </div>
    </div>
  </article>${state.thread[post.id] ? commentHtml : ""}`;
}
function feed() {
  return posts.filter((p) => state.tab === "forYou" ? p.feed !== "following" : p.feed !== "forYou").map(postHtml).join("");
}
function render() {
  const app = document.getElementById("app");
  let html = "";
  if (state.view === "home") {
    html = `<header class="top"><button class="rel" data-view="profile" aria-label="个人资料">${avatar(people.me, "me")}<span class="dot"></span></button>${ico.x}<button aria-label="账号" data-toast="当前账号 @chenlin">${ico.userplus}</button></header>
      <div class="tabs">
        <button class="${state.tab === "forYou" ? "on" : ""}" data-tab="forYou"><span class="label">为你推荐 ${ico.chev}</span></button>
        <button class="${state.tab === "following" ? "on" : ""}" data-tab="following">正在关注</button>
        <button class="plus" data-toast="列表已在这台页面演示里固定" aria-label="新建列表">${ico.plus}</button>
      </div>${feed()}<div class="pad"></div>`;
  } else if (state.view === "search") {
    html = `<div class="search"><button data-view="home">${ico.back}</button><input id="q" placeholder="搜索" value="${state.q || ""}"></div>
      <div class="view"><h2 style="padding:12px 16px;margin:0">当前趋势</h2>
      ${["AI替我说","GitHub 日更","活站","锚文本"].map((t) => `<button class="trend" data-toast="已搜索 ${t}"><small>正在流行</small><div><b>${t}</b></div></button>`).join("")}
      </div><div class="pad"></div>`;
  } else if (state.view === "grok") {
    html = `<div class="sub"><button data-view="home">${ico.back}</button>Grok</div>
      <div class="view" style="min-height:70dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px">
        ${ico.grok}<p style="font-size:24px;font-weight:800">有什么可以帮忙的？</p>
        <button class="trend" data-toast="先做会自己更新的仓库。一波流站点先别碰预印本和出书。">怎么把 GitHub 仓库做成活站？</button>
      </div>`;
  } else if (state.view === "notifications") {
    html = `<div class="sub"><button data-view="home">${ico.back}</button>通知</div>
      <button class="notice" data-open="fan">${avatar(people.wan)}<span><b>晚晚</b> 回复了你<br><small style="color:#536471">仓库更新好办，别最后全是 bot 在改 README 就行。</small></span></button>
      <button class="notice" data-open="fan">${avatar(people.fan)}<span><b>范师傅</b> 的帖子有 14 个喜欢</span></button>`;
  } else if (state.view === "messages") {
    html = `<div class="sub"><button data-view="home">${ico.back}</button>私信</div>
      <button class="dm" data-toast="晚晚：仓库更新好办，别最后全是 bot 在改 README 就行。">${avatar(people.wan)}<span><b>晚晚</b> <small style="color:#536471">@An_yhl</small><br><small style="color:#536471">仓库更新好办，别最后全是 bot 在改 README 就行。</small></span></button>
      <button class="dm" data-toast="刘老板：流量密码！">${avatar(people.liu)}<span><b>水族店刘老板</b><br><small style="color:#536471">流量密码！流量密码！流量密码！</small></span></button>`;
  } else if (state.view === "profile") {
    html = `<div class="sub"><button data-view="home">${ico.back}</button>陈林</div>
      <div style="padding:16px">${avatar(people.me, "")}<h2 style="margin:12px 0 0">陈林</h2><div style="color:#536471">@chenlin</div><p>把网站做成活的。仓库日更，锚文本写清楚。</p><div><b>86</b> <span style="color:#536471">正在关注</span>　<b>128</b> <span style="color:#536471">关注者</span></div></div>`;
  }
  if (state.compose) {
    html += `<div class="sheet"><div class="panel"><div class="bar"><button data-close>${ico.back}</button><button class="send" id="send" ${state.draft.trim() ? "" : "disabled"}>发帖</button></div>
      <div class="composer">${avatar(people.me)}<textarea id="draft" placeholder="有什么新鲜事？">${state.draft}</textarea></div></div></div>`;
  }
  if (state.toast) html += `<div class="toast">${state.toast}</div>`;
  app.innerHTML = html;
  document.getElementById("dock").innerHTML = `<nav class="nav">
      ${[["home","主页",ico.home],["search","搜索",ico.search],["grok","Grok",ico.grok],["notifications","通知",ico.bell],["messages","私信",ico.mail]].map(([id,label,icon]) => `<button data-view="${id}" aria-label="${label}">${icon}</button>`).join("")}
    </nav>`;
  const draft = document.getElementById("draft");
  if (draft) {
    draft.addEventListener("input", () => { state.draft = draft.value; document.getElementById("send").disabled = !draft.value.trim(); });
    draft.focus();
  }
}
document.body.addEventListener("click", (event) => {
  if (event.target.closest("a")) return;
  const t = event.target.closest("[data-tab],[data-view],[data-more],[data-qmore],[data-thread],[data-flag],[data-copy],[data-toast],[data-compose],[data-close],[data-reply],#send,[data-open]");
  if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; state.view = "home"; }
  if (t.dataset.view) state.view = t.dataset.view;
  if (t.dataset.more) state.open[t.dataset.more] = true;
  if (t.dataset.qmore) state.openQuote[t.dataset.qmore] = !state.openQuote[t.dataset.qmore];
  if (t.dataset.thread) state.thread[t.dataset.thread] = !state.thread[t.dataset.thread];
  if (t.dataset.flag) {
    const id = t.dataset.id;
    const key = t.dataset.flag;
    const cur = flag(id);
    state.flags[id] = { ...cur, [key]: !cur[key] };
    if (key === "bookmarked") state.toast = state.flags[id].bookmarked ? "已加入书签" : "已移出书签";
  }
  if (t.dataset.copy) {
    const post = find(t.dataset.copy);
    navigator.clipboard?.writeText(post && post.link ? post.link : location.href);
    state.toast = "链接已复制";
  }
  if (t.dataset.toast && !t.dataset.flag) state.toast = t.dataset.toast;
  if (t.dataset.compose || t.dataset.reply) { state.compose = true; }
  if (t.dataset.close) state.compose = false;
  if (t.id === "send" && state.draft.trim()) {
    posts.unshift({ id: "me" + Date.now(), user: "me", time: "现在", parts: [state.draft.trim()], replies: 0, reposts: 0, likes: 0, views: "1", feed: "both" });
    state.draft = ""; state.compose = false; state.view = "home"; state.tab = "forYou"; state.toast = "你的帖子已发送";
  }
  if (t.dataset.open) { state.view = "home"; state.tab = "forYou"; const el = document.querySelector(`[data-id="${t.dataset.open}"]`); }
  render();
  if (state.toast) setTimeout(() => { if (state.toast) { state.toast = ""; render(); } }, 1400);
});
render();
loadFeed();
</script>
